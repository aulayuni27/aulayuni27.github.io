<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>My Portofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/D-Day.css"/>
</head>
<body>
    <main class="bg-black text-white">
        <!-- section 1 - Hero -->
        <section id="hero" class="bg-[red] text-center py-[100px]">
            <h1 class="font-zelda text-center text-[128px]">My Portofolio</h1>
            <p class="px-[100px] text-[32px]">Aulia Qurota Ayuni</p>
        </section>

        <!-- section 2 - About me -->
        <section>
            <h2 class="font-zelda text-center text-[80px]">About me</h2>
            <p class="px-[100px] text-center text-[32px]">Halo semua aku aulia, dari SMKN 1 Surabaya </p>
        </section>

        <!-- section 3 - My Skills -->
        <section id="myskills" class="text-left w-[600px] mx-auto p-[60px]">
            <h2 class="font-zelda text-center text-[80px]">My Skills</h2>
            <div>
                <h3 class="font-zelda text-[48px]">Aku tertarik dengan mata kuliah di sisfor</h3>
            <ul class="text-[32px] list-inside list-disc">
                <li>Matematika</li>
                <li>Fisika</li>
                <li>Kimia</li>
            </ul>
            </div>
        </section>

         <!-- section 4 - My Experience -->
        <section id="Experience" class="py-[180px]">
            <div>
            <h2 class="font-zelda text-[128px] text-white text-shadow-[0_5px_0_#7A3D21] text-center">My Experience</h2>

            <img src="DAY 1/images/fotoku/foto1.png" alt="Deskripsi foto 1">
            <img src="DAY 1/images/fotoku/foto2.png" alt="Deskripsi foto 2">
            <img src="DAY 1/images/fotoku/foto3.png" alt="Deskripsi foto 3">
